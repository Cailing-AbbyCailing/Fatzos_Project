<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatzo's - Lechon</title>
    <link rel="stylesheet" href="./css/index.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
            <img src="./img/logo.png" alt="Fatzo's Lechon & Catering Services" class="brand-logo">
            </div>
        </header>

        <!-- Sub-page Content Area -->
        <main class="subpage-main">
            <div class="content-card">
                <h2 class="section-title">LECHON</h2>
                
                <!-- Inner box container for your products -->
                <div class="inner-box">
                    
                    <!-- Product 1: Whole Lechon XL -->
                    <div class="package-card">
                        <span class="package-name">Whole Lechon XL</span>
                        <div class="price-input">₱ 12000</div>
                    </div>

                    <!-- Product 2: Whole Lechon Large -->
                    <div class="package-card">
                        <span class="package-name">Whole Lechon Large</span>
                        <div class="price-input">₱ 9500</div>
                    </div>

                    <!-- Product 3: Whole Lechon Medium -->
                    <div class="package-card">
                        <span class="package-name">Whole Lechon Medium</span>
                        <div class="price-input">₱ 7500</div>
                    </div>

                    <!-- Product 4: Boneless Roll 5kg -->
                    <div class="package-card">
                        <span class="package-name">Boneless Roll 5kg</span>
                        <div class="price-input">₱ 2800</div>
                    </div>

                </div>

                <!-- Back to Main Menu Button -->
                <a href="./home.html" class="back-btn" aria-label="Back to Main Menu">
                    <svg viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
