<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatzo's - Contact</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-container">
        <!-- Header Section with Image Logo -->
        <header class="header">
            <div class="header-content">
                <img src="./logo.png" alt="Fatzo's Lechon & Catering Services" class="brand-logo">
            </div>
        </header>

        <!-- Sub-page Content Area -->
        <main class="subpage-main">
            <div class="content-card">
                <h2 class="section-title">CONTACT</h2>
                
                <!-- Inner outline container box -->
                <div class="inner-box">
                    
                    <!-- Hotline Field -->
                    <div class="contact-group">
                        <label class="contact-subtitle">Hotline</label>
                        <div class="info-field">+63 917 123 4567</div>
                    </div>

                    <!-- Email Field -->
                    <div class="contact-group">
                        <label class="contact-subtitle">Email</label>
                        <div class="info-field">orders@fatzoslechon.ph</div>
                    </div>

                    <!-- Address Field -->
                    <div class="contact-group">
                        <label class="contact-subtitle">Address</label>
                        <div class="info-field">Zone 4, National Highway, CDO</div>
                    </div>

                    <!-- Order Link Field pointing directly to the Google Form -->
                    <div class="contact-group">
                        <label class="contact-subtitle">Order</label>
                        <a href="https://docs.google.com/forms/d/e/1FAIpQLSemCJ8jRpBieCPEbgI6t_gpwh7Fn4FF0WzJzKtk_8xF3vNh1g/viewform?usp=publish-editor" target="_blank" class="info-field" style="text-decoration: none; cursor: pointer; display: inline-block;">Order Here</a>
                    </div>

                </div>

                <!-- Back Arrow Button -->
                <a href="./index.html" class="back-btn" aria-label="Back to Main Menu">
                    <svg viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
            </div>
        </main>
    </div>

    <script src="./client.js"></script>
</body>
</html>
