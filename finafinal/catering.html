<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatzo's - Catering</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
            <img src="./logo.png" alt="Fatzo's Lechon & Catering Services" class="brand-logo">
            </div>
        </header>

        <!-- Sub-page Content Area -->
        <main class="subpage-main">
            <div class="content-card">
                <h2 class="section-title">CATERING</h2>
                
                <!-- Inner outline container box for packages -->
                <div class="inner-box">
                    
                    <!-- Package 1: Fiesta Pack A -->
                    <div class="package-card">
                        <span class="package-name">Fiesta Pack A (50 Pax)</span>
                        <div class="price-input">₱ 18500</div>
                    </div>

                    <!-- Package 2: Fiesta Pack B -->
                    <div class="package-card">
                        <span class="package-name">Fiesta Pack B (100 Pax)</span>
                        <div class="price-input">₱ 34000</div>
                    </div>

                    <!-- Package 3: Executive -->
                    <div class="package-card">
                        <span class="package-name">Executive (Per Head)</span>
                        <div class="price-input">₱ 450</div>
                    </div>

                </div>

                <!-- Back to Main Menu Button -->
                <a href="./index.html" class="back-btn" aria-label="Back to Main Menu">
                    <svg viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
