<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatzo's - Contact</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <img src="./logo.png" alt="Fatzo's Logo" class="brand-logo">
            </div>
            <button class="header-icon-btn" aria-label="Exit or Action">
                <span class="exit-icon">[&rarr;]</span>
            </button>
        </header>

        <!-- Sub-page Content Area -->
        <main class="subpage-main">
            <div class="content-card">
                <h2 class="section-title">CONTACT</h2>
                
                <!-- Inner box containing business details and action buttons -->
                <div class="inner-box contact-content">
                    
                    <!-- Operating Hours Section -->
                    <div class="contact-group">
                        <h3 class="contact-subtitle">Operating Hours</h3>
                        <p class="contact-text">Mon - Sun: 8:00 AM - 6:00 PM</p>
                    </div>

                    <!-- Store Location Section -->
                    <div class="contact-group">
                        <h3 class="contact-subtitle">Store Location</h3>
                        <p class="contact-text">Cagayan de Oro City, Philippines</p>
                    </div>

                    <!-- Direct Call & Messaging Section -->
                    <div class="contact-group">
                        <h3 class="contact-subtitle">Direct Hotline</h3>
                        <a href="tel:+639123456789" class="contact-link-btn">&#128222; Call +63 912 345 6789</a>
                    </div>

                    <!-- Order Form Gateway Button -->
                    <div class="contact-group">
                        <h3 class="contact-subtitle">Ready to Order?</h3>
                        <a href="https://forms.google.com" target="_blank" class="order-gateway-btn">Open Order Form</a>
                    </div>

                </div>

                <!-- Back to Main Menu Button with Left Arrow -->
                <a href="./index.html" class="back-btn" aria-label="Back to Main Menu">
                    <span class="arrow-icon">&larr;</span>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
